name: Bug report
description: Something in Apature isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. About Apature shows the version and build; Help › Reveal Log in Finder opens `apature.log`.
        Check screenshots and log excerpts for captions, names or locations you would not publish.
  - type: input
    id: version
    attributes:
      label: Apature version and build
      placeholder: "0.1.0 build 130"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, MacBook Pro M1"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and file type
      placeholder: "Nikon Z 6 II, NEF + JPEG"
  - type: textarea
    id: steps
    attributes:
      label: What you did and what happened
      placeholder: "1. Opened a card… 2. Clicked Start ingest… Expected… Got…"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from apature.log
      render: text
