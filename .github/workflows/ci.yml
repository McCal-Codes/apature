name: CI

# Linux only: Linux runner minutes are the cheapest, and the library crates
# plus a desktop build cover what a push can break. macOS bundling, signing
# and the real-card checks stay on the Mac.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
