[package]
name = "apature-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded-JPEG preview extraction, decoding and thumbnail caching"

[dependencies]
apature-core.workspace = true
thiserror.workspace = true
memmap2.workspace = true
jpeg-decoder.workspace = true
image.workspace = true
log.workspace = true

# HEIC is HEVC: Windows decodes it through WIC (src/system.rs). The same
# windows release the trash crate already uses, so nothing new is built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile.workspace = true
