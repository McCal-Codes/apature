<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A: Lensy — the lens is the eye; stubby arms and legs; hot-shoe cap -->
  <rect width="512" height="512" fill="#1B1B1F"/>
  <!-- legs -->
  <rect x="190" y="392" width="34" height="52" rx="14" fill="#BDB4EE"/>
  <rect x="288" y="392" width="34" height="52" rx="14" fill="#BDB4EE"/>
  <!-- arms -->
  <rect x="78" y="250" width="52" height="30" rx="15" fill="#BDB4EE" transform="rotate(-20 104 265)"/>
  <rect x="382" y="250" width="52" height="30" rx="15" fill="#BDB4EE" transform="rotate(20 408 265)"/>
  <!-- cap (prism hump + hot shoe) -->
  <rect x="206" y="118" width="100" height="40" rx="14" fill="#E2DDFB"/>
  <rect x="236" y="104" width="40" height="18" rx="6" fill="#E2DDFB"/>
  <!-- body -->
  <rect x="112" y="150" width="288" height="252" rx="52" fill="#ECEBF3"/>
  <!-- grip stripe -->
  <rect x="112" y="200" width="288" height="18" fill="#D9D4F4"/>
  <!-- shutter button -->
  <rect x="330" y="128" width="40" height="22" rx="8" fill="#BDB4EE"/>
  <!-- lens (eye) -->
  <circle cx="256" cy="280" r="82" fill="#26262B"/>
  <circle cx="256" cy="280" r="66" fill="#3A3A42"/>
  <circle cx="256" cy="280" r="44" fill="#15151A"/>
  <circle cx="276" cy="262" r="16" fill="#FFFFFF"/>
  <circle cx="238" cy="296" r="7" fill="#FFFFFF" fill-opacity="0.7"/>
  <!-- blush -->
  <circle cx="150" cy="330" r="12" fill="#F2A6C9" fill-opacity="0.8"/>
  <circle cx="362" cy="330" r="12" fill="#F2A6C9" fill-opacity="0.8"/>
  <!-- smile -->
  <path d="M236 382 Q256 398 276 382" fill="none" stroke="#26262B" stroke-width="7" stroke-linecap="round"/>
</svg>
