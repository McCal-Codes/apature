[workspace]
resolver = "2"
members = [
    "crates/photo-core",
    "crates/photo-preview",
    "crates/photo-metadata",
    "crates/photo-ingest",
    "apps/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/McCal-Codes/photo-workflow"
rust-version = "1.80"

[workspace.dependencies]
photo-core = { path = "crates/photo-core" }
photo-preview = { path = "crates/photo-preview" }
photo-metadata = { path = "crates/photo-metadata" }
photo-ingest = { path = "crates/photo-ingest" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
walkdir = "2.5"
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-decoder = { version = "0.3", default-features = false }
regex = "1"
directories = "6"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.33"
egui = "0.33"
rfd = "0.17"
crossbeam-channel = "0.5"

# Image decoding in an unoptimised debug build is painfully slow, so always
# optimise dependencies even in dev.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
